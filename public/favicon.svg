<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 555 532" width="555" height="532">
  <title>Calendar U favicon</title>
  <desc>Red rounded calendar icon with a U-shaped mark</desc>

  <!-- Outer rounded frame -->
  <rect x="37" y="22" width="499" height="480" rx="128" fill="#B91525"/>

  <!-- Calendar body -->
  <path
    d="M98 160
       C98 120 128 89 168 89
       H403
       C443 89 473 120 473 160
       V385
       C473 427 440 460 399 460
       H172
       C131 460 98 427 98 385
       Z"
    fill="#FFFFFF"/>

  <!-- Binding tabs -->
  <path d="M162 89 V62 C162 53 168 48 178 48 H180 C190 48 195 53 195 62 V89 Z"
        fill="#FFFFFF"/>
  <path d="M375 89 V62 C375 53 381 48 391 48 H393 C403 48 408 53 408 62 V89 Z"
        fill="#FFFFFF"/>

  <!-- Header divider -->
  <rect x="98" y="159" width="375" height="16" fill="#E6A0A6"/>

  <!-- U-shaped mark -->
  <path
    d="M216 217
       V328
       C216 373 237 400 286 400
       C335 400 357 373 357 328
       V217"
    fill="none"
    stroke="#B91525"
    stroke-width="29"
    stroke-linecap="butt"
    stroke-linejoin="round"/>
</svg>
